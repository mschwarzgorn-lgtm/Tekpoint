<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tekpoint — Protected Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a1628;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
.gate{text-align:center;padding:40px;max-width:420px;width:90%}
.logo{margin-bottom:30px}
.logo img{height:50px}
h1{font-size:1.3rem;font-weight:400;margin-bottom:8px;color:#e0e0e0}
p{font-size:0.9rem;color:#888;margin-bottom:30px}
input{width:100%;padding:14px 18px;border:2px solid #1e3a5f;border-radius:8px;background:#0d1f3c;color:#fff;font-size:1rem;outline:none;margin-bottom:16px;transition:border-color 0.2s}
input:focus{border-color:#2196F3}
button{width:100%;padding:14px;border:none;border-radius:8px;background:linear-gradient(135deg,#1976D2,#2196F3);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:transform 0.1s,opacity 0.1s}
button:hover{transform:translateY(-1px);opacity:0.95}
.error{color:#ef5350;font-size:0.85rem;margin-top:-8px;margin-bottom:12px;display:none}
.footer{margin-top:40px;font-size:0.75rem;color:#555}
/* ===== MOBILE TOUCH FIX ===== */
.nav-links a, .hamburger, .lang-dropdown-btn { touch-action: manipulation; -webkit-tap-highlight-color: rgba(232,121,43,0.2); cursor: pointer; }
</style>
<link rel="stylesheet" href="/css/global-fixes.css">
</head>
<body>
<div class="gate">
<div class="logo"><img src="images/tekpoint-logo-white.png" alt="Tekpoint" onerror="this.outerHTML='<span style=&quot;font-size:2rem;font-weight:700;color:#2196F3&quot;>TEKPOINT</span>'"></div>
<h1>Staging Preview</h1>
<p>This site is password protected.<br>Enter the access code to continue.</p>
<form id="gateForm">
<input type="password" id="pw" placeholder="Enter password" autocomplete="off" autofocus>
<div class="error" id="err">Incorrect password. Please try again.</div>
<button type="submit">Enter Site →</button>
</form>
<div class="footer">© 2026 Tekpoint GmbH — Confidential Preview</div>
</div>
<script>
(function(){
// Password: "Tekpoint2025!" — SHA-256 hashed for client-side verification
var HASH='0b44cbe16aa380ad53623db003dffc92b37bbf8474f26ec3bf6402bc219864b0';
function sha256(s){
return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s))
.then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')});
}
if(sessionStorage.getItem('tekpoint_auth')==='granted'){window.location.replace('/');return}
document.getElementById('gateForm').addEventListener('submit',function(e){
e.preventDefault();
var pw=document.getElementById('pw').value;
sha256(pw).then(function(h){
if(h===HASH){sessionStorage.setItem('tekpoint_auth','granted');window.location.replace('/')}
else{document.getElementById('err').style.display='block';document.getElementById('pw').value=''}
});
});
})();
</script>
</body>
</html>
