<body>
<div id="_tk_bar"></div>
<div id="_tk_root"></div>
<script>
(function(){
  var root = document.getElementById('_tk_root');
  var bar = document.getElementById('_tk_bar');
  var loadedStyles = [];
  var currentPage = '';

  function navigate(pagePath) {
    if (pagePath === currentPage) return;
    bar.style.display = 'block';

    fetch('./' + pagePath).then(function(r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    }).then(function(html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');

      // Remove previously injected styles
      loadedStyles.forEach(function(s) { try { s.remove(); } catch(e){} });
      loadedStyles = [];

      // Inject <style> and <link rel=stylesheet> from loaded page's <head>
      doc.querySelectorAll('head style, head link[rel="stylesheet"]').forEach(function(el) {
        var clone = document.importNode(el, true);
        document.head.appendChild(clone);
        loadedStyles.push(clone);
      });

      // Set body content (strip scripts - we handle interactivity ourselves)
      var bodyHTML = doc.body.innerHTML;
      // Remove all script tags from the content
      bodyHTML = bodyHTML.replace(/<script[\s\S]*?<\/script>/gi, '');
      root.innerHTML = bodyHTML;

      // Update title
      var t = doc.querySelector('title');
      if (t) document.title = t.textContent;

      currentPage = pagePath;
      window.scrollTo(0, 0);

      // Update URL hash
      history.pushState({ page: pagePath }, '', pagePath === 'home.html' ? '#' : '#' + pagePath);

      // Re-initialize interactive elements
      initLangDropdown();
      initNavDropdowns();
      initHamburger();

      bar.style.display = 'none';
    }).catch(function(err) {
      root.innerHTML = '<div style="padding:60px;text-align:center;font-family:sans-serif;"><h2>Page not found</h2><p>' + pagePath + ' — ' + err.message + '</p></div>';
      bar.style.display = 'none';
    });
  }

  // Language dropdown - click to toggle
  function initLangDropdown() {
    var btn = root.querySelector('.lang-dropdown-btn');
    var menu = root.querySelector('.lang-dropdown-menu');
    if (!btn || !menu) return;

    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (menu.classList.contains('open')) {
        menu.classList.remove('open');
      } else {
        var rect = btn.getBoundingClientRect();
        menu.style.top = (rect.bottom + 4) + 'px';
        var left = rect.right - 160;
        if (left < 8) left = 8;
        menu.style.left = left + 'px';
        menu.classList.add('open');
      }
    });
  }

  // Nav dropdowns - make sure hover works, add click support for mobile

  function initHamburger() {
    var hamburger = root.querySelector('.hamburger');
    var navLinks = root.querySelector('.nav-links');
    var overlay = root.querySelector('.mobile-overlay');
    if (!hamburger || !navLinks) return;

    function closeMenu() {
      hamburger.classList.remove('active');
      navLinks.classList.remove('mobile-open');
      if (overlay) overlay.classList.remove('active');
    }
    function openMenu() {
      hamburger.classList.add('active');
      navLinks.classList.add('mobile-open');
      if (overlay) overlay.classList.add('active');
    }
    hamburger.addEventListener('click', function(e) {
      e.stopPropagation();
      if (navLinks.classList.contains('mobile-open')) { closeMenu(); }
      else { openMenu(); }
    });
    if (overlay) overlay.addEventListener('click', closeMenu);

    var dropdowns = navLinks.querySelectorAll('.nav-dropdown > a');
    dropdowns.forEach(function(trigger) {
      trigger.addEventListener('click', function(e) {
        if (window.innerWidth <= 768) {
          var parent = this.parentElement;
          var isExpanded = parent.classList.contains('mobile-expanded');
          navLinks.querySelectorAll('.nav-dropdown').forEach(function(d) {
            d.classList.remove('mobile-expanded');
          });
          if (!isExpanded) {
            e.preventDefault();
            parent.classList.add('mobile-expanded');
          }
        }
      });
    });

    navLinks.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function(e) {
        if (!e.defaultPrevented) { if (navLinks.classList.contains('mobile-open')) { e.preventDefault(); var href = this.getAttribute('href'); closeMenu(); if (href) window.location.href = href; } }
      });
    });
  }

  function initNavDropdowns() {
    root.querySelectorAll('.nav-dropdown').forEach(function(dd) {
      var toggle = dd.querySelector('a');
      if (!toggle) return;
      toggle.addEventListener('click', function(e) {
        var menu = dd.querySelector('.dropdown-menu');
        if (menu) {
          // On mobile, toggle visibility
          var isOpen = menu.style.display === 'block';
          // Close all others first
          root.querySelectorAll('.dropdown-menu').forEach(function(m) { m.style.display = ''; });
          if (!isOpen) {
            menu.style.display = 'block';
            e.preventDefault();
          }
        }
      });
    });
  }

  // Global click handler - event delegation for all links and closing dropdowns
  document.addEventListener('click', function(e) {
    // Close language dropdown on any outside click
    var langMenu = root.querySelector('.lang-dropdown-menu');
    if (langMenu) langMenu.classList.remove('open');

    // Close nav dropdown menus
    root.querySelectorAll('.dropdown-menu').forEach(function(m) { m.style.display = ''; });

    // Find clicked link
    var link = e.target.closest('a');
    if (!link) return;

    var href = link.getAttribute('href');
    if (!href) return;

    // Skip external links, anchors, mailto, tel
    if (href.startsWith('http') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('javascript:')) return;
    if (href === '#') { e.preventDefault(); return; }
    if (href.startsWith('#') && !href.includes('.html')) return;

    // Handle internal .html links
    if (href.includes('.html')) {
      e.preventDefault();
      var page = href.replace(/^\.\//, '').replace(/^\//, '');
      navigate(page);
    }
  });

  // Handle back/forward
  window.addEventListener('popstate', function(e) {
    if (e.state && e.state.page) {
      currentPage = '';
      navigate(e.state.page);
    } else {
      currentPage = '';
      navigate('home.html');
    }
  });

  // Initial load
  var hash = location.hash.replace('#', '');
  navigate(hash && hash.includes('.html') ? hash : 'home.html');
})();
</script>
